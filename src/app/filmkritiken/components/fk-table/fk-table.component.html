<table mat-table [dataSource]="bewertungenDataSource">
    <!-- Person -->
    <ng-container matColumnDef="person">
        <th mat-header-cell *matHeaderCellDef> Person </th>
        <td mat-cell *matCellDef="let element"> {{element.von}} </td>
        <td mat-footer-cell *matFooterCellDef> Durchschnitt </td>
    </ng-container>

    <!-- Wertung -->
    <ng-container matColumnDef="wertung">
        <th mat-header-cell *matHeaderCellDef> Wertung </th>
        <td mat-cell *matCellDef="let element"> {{element.wertung}} </td>
        <td mat-footer-cell *matFooterCellDef> {{getAverageWertung()}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
</table>
