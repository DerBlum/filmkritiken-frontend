<div>
    <table mat-table [dataSource]="filmbewertungen">
        <!-- Filmtitel -->
        <ng-container matColumnDef="film">
            <th mat-header-cell *matHeaderCellDef> Filmtitel </th>
            <td mat-cell *matCellDef="let element"> {{element.film.name}} </td>
        </ng-container>

        <!-- Vorschlag Von -->
        <ng-container matColumnDef="vorschlagvon">
            <th mat-header-cell *matHeaderCellDef> Vorschalg von </th>
            <td mat-cell *matCellDef="let element"> {{element.film.vorschlagvon}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
