<div fxLayout="column" lfLayout.lg="row" fxLayout.xl="row">

    <div class="fk-filminfo" fxFlex="100" fxFlex.xl="66" fxLayout="column" fxLayout.sm="row" fxLayout.md="row"
        lfLayout.md="row" fxLayout.xl="row" fxLayout.lg="row">
        <div class="fk-filminfo-img" fxFlex>
            <img src="assets/images/chihiro.jpg" max-width="100%" height="auto">
            <p class="fk-filminfo-img-credits"></p>
        </div>
        <div class="fk-filminfo-txt" fxFlex="100">
            <span> Beitrag von: {{film.beitragvon}} </span>
        </div>
    </div>

    <div class="fk-filmbewertungen" fxFlex="100" fxFlex.xl="33">
        <h4>Bewertungen</h4>
        <table mat-table [dataSource]="bewertungenDataSource">
            <!-- Person -->
            <ng-container matColumnDef="person">
                <th mat-header-cell *matHeaderCellDef> Person </th>
                <td mat-cell *matCellDef="let element"> {{element.von}} </td>
                <td mat-footer-cell *matFooterCellDef> Durchschnitt </td>
            </ng-container>

            <!-- Wertung -->
            <ng-container matColumnDef="wertung">
                <th mat-header-cell *matHeaderCellDef> Wertung </th>
                <td mat-cell *matCellDef="let element"> {{element.wertung}} </td>
                <td mat-footer-cell *matFooterCellDef> {{getAverageWertung()}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
        </table>
    </div>
</div>
