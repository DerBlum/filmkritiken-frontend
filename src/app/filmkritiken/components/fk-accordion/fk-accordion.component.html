<div>
    <mat-accordion>
        <mat-expansion-panel [expanded]="items[0] === item" *ngFor="let item of items">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <span class="span-filmtitel">
                        <h3>
                            {{item.film.titel}}
                        </h3>
                    </span>
                </mat-panel-title>
                <mat-panel-description>
                    <span class="span-filmdatum">
                        <h3>
                            {{item.filmbewertungDetails.besprochenam.toLocaleDateString(undefined, { month:
                            '2-digit',day: '2-digit',year: 'numeric'})}}
                        </h3>
                    </span>
                </mat-panel-description>
            </mat-expansion-panel-header>

            <fk-content [filmbewertungen]="item"></fk-content>

        </mat-expansion-panel>
    </mat-accordion>
</div>
