<div>
  <p>
    <mat-toolbar class="app-toolbar">
      <span class="toolbar-title">
        <h2>Filmkritiken</h2>
      </span>
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon class="toolbar-menu-item-icon">menu</mat-icon>
      </button>
      <mat-menu class="toolbar-menu" #menu="matMenu" yPosition="below" xPosition="before">
        <button mat-menu-item *ngIf="!isLoggedIn" (click)="loginPopup()">
          <mat-icon class="toolbar-menu-item-icon">account_circle</mat-icon>
          <span class="toolbar-menu-item-text">Anmelden</span>
        </button>
        <button mat-menu-item *ngIf="isLoggedIn && canCopyToken" (click)="copyAuthToken()">
          <mat-icon class="toolbar-menu-item-icon">content_copy</mat-icon>
          <span class="toolbar-menu-item-text">Token kopieren</span>
        </button>
        <button mat-menu-item *ngIf="isLoggedIn && canAddFilm" (click)="openAddFilmDialog()">
          <mat-icon class="toolbar-menu-item-icon">add</mat-icon>
          <span class="toolbar-menu-item-text">Film hinzufügen</span>
        </button>
        <button mat-menu-item *ngIf="isLoggedIn" (click)="logout()">
          <mat-icon class="toolbar-menu-item-icon">logout</mat-icon>
          <span class="toolbar-menu-item-text">Abmelden</span>
        </button>
      </mat-menu>
    </mat-toolbar>
  </p>

  <div class="content" role="main">
    <router-outlet></router-outlet>
  </div>
</div>

<router-outlet></router-outlet>
